name: Build and publish Netcore N60 Pro high-power firmware

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream branch/tag/commit; use pinned for the known-good commit"
        required: false
        default: "openwrt-24.10-6.6"
permissions:
  contents: write

concurrency:
  group: n60pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/microsoft \
            /usr/local/.ghcup
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout build project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Read upstream revision
        id: upstream
        env:
          SOURCE_REF_INPUT: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/project/upstream.env"
          case "${SOURCE_REF_INPUT:-}" in
            "")
              UPSTREAM_REF="$UPSTREAM_BRANCH"
              ;;
            pinned)
              UPSTREAM_REF="$UPSTREAM_PINNED_REF"
              ;;
            *)
              UPSTREAM_REF="$SOURCE_REF_INPUT"
              ;;
          esac
          case "$UPSTREAM_REF" in
            *[!A-Za-z0-9._/-]*)
              echo "Invalid upstream ref: $UPSTREAM_REF" >&2
              exit 1
              ;;
          esac
          printf 'repository=%s\n' "$UPSTREAM_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$UPSTREAM_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: openwrt
          fetch-depth: 1
          persist-credentials: false

      - name: Record upstream commit
        run: |
          commit="$(git -C "$GITHUB_WORKSPACE/openwrt" rev-parse HEAD)"
          printf 'Upstream commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
          printf 'UPSTREAM_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            bc \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            diffstat \
            file \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc-multilib \
            genisoimage \
            gettext \
            git \
            gperf \
            help2man \
            intltool \
            lib32gcc-s1 \
            libbz2-dev \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp-dev \
            libltdl-dev \
            liblzma-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            libxml2-dev \
            libxslt1-dev \
            libyaml-dev \
            libzstd-dev \
            lld \
            llvm \
            lrzsz \
            lz4 \
            make \
            ninja-build \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-distutils \
            python3-docutils \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xmlto \
            xz-utils \
            zlib1g-dev \
            zstd

      - name: Build only high-power Netcore N60 Pro
        run: |
          bash "$GITHUB_WORKSPACE/project/scripts/build-n60pro-high-power.sh" \
            "$GITHUB_WORKSPACE/openwrt" \
            "$GITHUB_WORKSPACE/project"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n60-pro-high-power-${{ github.run_number }}
          path: project/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < project/dist/VERSION.txt)"
          tag="v${version}"
          asset="project/dist/netcore-n60pro-${version}.bin"
          test -f "$asset" || {
            echo "Release asset not found: $asset" >&2
            exit 1
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                if [ -n "$name" ]; then
                  gh release delete-asset "$tag" "$name" --yes
                fi
              done
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" \
              --title "Netcore N60 Pro High-Power ${version}" >/dev/null
          else
            gh release create "$tag" "$asset" \
              --title "Netcore N60 Pro High-Power ${version}" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
